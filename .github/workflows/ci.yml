# Run tests on every push and pull request.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["test"]
        include:
          # One leg also installs the optional extras so the MCP / server /
          # reader / metadata tests run instead of being import-skipped.
          - python-version: "3.12"
            extras: "test,mcp,server,readers,metadata"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package and test deps
        run: pip install -U pip && pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests (exclude slow)
        run: pytest -m "not slow"
